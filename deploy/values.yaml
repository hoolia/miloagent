replicaCount: 1

image:
  # Public image built from this repository. A fork that builds its own image
  # overrides this with ghcr.io/<owner>/miloagent.
  repository: ghcr.io/hoolia/miloagent
  tag: latest
  pullPolicy: Always

# The published image (ghcr.io/<owner>/miloagent) is PUBLIC, so no pull secret is needed
# by default. Set create: true and supply dockerconfigjson via a downstream values override
# only if you host the image in a private registry.
# NOTE: keep the default '{"auths":{}}' VALID — an invalid-base64 placeholder here would
# break ALL image pulls on the node.
imagePullSecret:
  create: false
  dockerconfigjson: '{"auths":{}}'

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: "2"
    memory: 2Gi

# Probes of the miloagent container, each a probe spec; null drops one. The defaults
# call GET /health, which answers from memory and does not see a broken data volume; a
# downstream liveness override can check the volume as well. Helm merges an override
# into these maps: an exec override sets httpGet: null.
probes:
  startup:
    httpGet:
      path: /health
      port: web
    periodSeconds: 10
    failureThreshold: 30
  readiness:
    httpGet:
      path: /health
      port: web
    initialDelaySeconds: 10
    periodSeconds: 10
  liveness:
    httpGet:
      path: /health
      port: web
    periodSeconds: 30
    failureThreshold: 5

# Extra containers in the pod and extra volumes. A sidecar can mount the volumes "data"
# (the PVC) and "logs" (the log emptyDir). The name "exporter" belongs to bridge.exporter.
extraContainers: []
extraVolumes: []

# Read-only bridge to MiloAgent (docs/bridge.md), one image built from bridge/ of this
# repository. It changes nothing in MiloAgent: no approve, post, pause or settings path.
bridge:
  enabled: true
  image:
    repository: ghcr.io/hoolia/miloagent-bridge
    tag: latest
    pullPolicy: Always
  # Deployment and Service <release>-bridge: MCP (streamable HTTP, stateless) at /mcp,
  # GET /signals and GET /healthz on port 8000. It logs in to the dashboard API as
  # env.MILO_WEB_USER and reads two exports. Callers are not authenticated; put an MCP
  # gateway in front and keep the NetworkPolicy.
  server:
    enabled: true
    # Secret key with the dashboard password. An empty name takes the chart's env Secret
    # when env.MILO_WEB_PASS is set, else existingSecrets.env.
    passwordSecret:
      name: ""
      key: MILO_WEB_PASS
    # Extra environment: MILOAGENT_CACHE_SECONDS, MILOAGENT_SIGNAL_STATUSES, MILOAGENT_TIMEOUT
    env: {}
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
    service:
      port: 8000
      annotations: {}
    mcp:
      # Non-empty: annotations agentgateway.dev/mcp-path and mcp-target-name for the
      # MCP target discovery of an agentgateway
      targetName: ""
      # Service port appProtocol, for example agentgateway.dev/mcp
      appProtocol: ""
    networkPolicy:
      enabled: true
      # Namespace selectors allowed besides the own namespace, for example an MCP gateway:
      # - matchLabels: {kubernetes.io/metadata.name: agentgateway}
      ingressNamespaces: []
      # Egress limited to DNS and MiloAgent's dashboard port
      egress:
        enabled: false
        dns:
          namespace: openshift-dns
          port: 5353
  # Prometheus exporter sidecar "exporter" in the MiloAgent pod, on port monitoring.port.
  # Rendered only with monitoring.enabled. It runs as root because MiloAgent's volume
  # belongs to root (anyuid, see securityContext.enabled), without any capability.
  exporter:
    enabled: true
    # EXPORTER_INTERVAL_SECONDS, EXPORTER_TIMEOUT_SECONDS
    env: {}
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
    securityContext:
      runAsUser: 0
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: [ALL]

# Prometheus Operator monitoring: a metrics Service, a ServiceMonitor and the alert rules
# of docs/alerts.md. The miloagent_* series come from the exporter container of
# bridge.exporter; without it only the kube-state-metrics and kubelet alerts work. Needs
# the monitoring.coreos.com CRDs.
monitoring:
  enabled: false
  port: 9420
  interval: 60s
  rules:
    enabled: true
    # Extra labels on every alert, for example to route them in Alertmanager
    labels: {}
    runbookBaseUrl: https://github.com/hoolia/miloagent/blob/main/docs/alerts.md
    # MiloAgentNoRecentScan: a scan within maxAgeHours is due between fromHour and toHour
    # (UTC, inside settings bot.active_hours)
    noRecentScan:
      maxAgeHours: 3
      fromHour: 11
      toHour: 23

persistence:
  # null → use the cluster's default StorageClass. Override per-environment (e.g. an RWO
  # block class) in your downstream values. RWO is required (single-writer SQLite + Recreate).
  storageClass: null
  size: 5Gi

service:
  port: 8420

route:
  enabled: true
  # Empty → OpenShift auto-generates a host. Set your own hostname in downstream values.
  host: ""
  # Extra Route annotations (generic passthrough). Downstream deployments use these to drive
  # platform integrations, e.g. cert-manager (TLS) and external-dns (DNS). Empty by default.
  annotations: {}
  termination: edge
  insecureEdgeTerminationPolicy: Redirect

# OpenShift SCC: headless Chromium (web/cookie mode) runs as an arbitrary UID and needs the
# anyuid SCC, granted to the namespace default ServiceAccount via a RoleBinding. Disable on
# non-OpenShift clusters or where the default SA already has sufficient privileges.
securityContext:
  enabled: true

# Non-secret config. Empty → chart uses the bundled defaults in deploy/files/.
config:
  settings: ""
  expert_personas: ""

# Credential config files (whole-file; the app loader replaces whole files, never merges).
# Placeholders by default — real values come from the ArgoCD Application valuesObject.
secrets:
  llm: ""
  reddit_accounts: ""
  reddit_api: ""
  twitter_accounts: ""
  telegram: ""
  telegram_user_accounts: ""

# Scalar env (envFrom secret). An empty MILO_WEB_PASS is left out, for existingSecrets.env.
env:
  MILO_WEB_USER: admin
  MILO_WEB_PASS: changeme-set-a-strong-password
  MILO_WEB_TOKEN: ""
  TELEGRAM_BOT_TOKEN: ""
  TZ: UTC

# Secrets that already exist in the namespace (made by hand, External Secrets or Sealed
# Secrets), so credentials stay out of the values. A change to them does not restart the
# pod; run `kubectl rollout restart` after one.
existingSecrets:
  # Secret whose keys become environment variables (MILO_WEB_PASS, MILO_WEB_TOKEN,
  # TELEGRAM_BOT_TOKEN). It comes after env, so its keys win.
  env: ""
  # Secret with whole credential files: key <name>.yaml is mounted at
  # /app/config/<name>.yaml for every <name> in fileKeys, in place of secrets.<name>.
  files: ""
  fileKeys: []   # for example [llm, reddit_accounts]

# Extra objects rendered as given (no templating), for example an ExternalSecret.
extraObjects: []
