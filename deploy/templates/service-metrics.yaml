{{- if .Values.monitoring.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "miloagent.fullname" . }}-metrics
  labels:
    {{- include "miloagent.metricsLabels" . | nindent 4 }}
spec:
  selector:
    {{- include "miloagent.selectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      port: {{ .Values.monitoring.port }}
      targetPort: metrics
{{- end }}
