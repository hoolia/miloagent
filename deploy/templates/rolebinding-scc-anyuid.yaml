{{- if .Values.securityContext.enabled }}
{{- fail "securityContext.enabled was removed in chart 0.6.0 and no longer binds anyuid: the stock anyuid RoleBinding is opt-in with securityContext.anyuidRoleBinding; see README, Upgrade from 0.5" }}
{{- end }}
{{- if .Values.securityContext.anyuidRoleBinding }}
# Opt-in: the stock anyuid SCC for the MiloAgent ServiceAccount only, on a cluster without
# an SCC like anyuid-tenant. Other pods of the namespace, the bridge included, keep theirs.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "miloagent.fullname" . }}-anyuid
  labels:
    {{- include "miloagent.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:anyuid
subjects:
  - kind: ServiceAccount
    name: {{ include "miloagent.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
