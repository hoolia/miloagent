apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "miloagent.fullname" . }}
  labels:
    {{- include "miloagent.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # Recreate (not RollingUpdate): the RWO PVC + single-writer SQLite cannot be held by
  # two pods at once, so a rolling rollout would deadlock.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "miloagent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "miloagent.selectorLabels" . | nindent 8 }}
      annotations:
        # Roll the pod automatically when config/secrets change (no Reloader on cluster).
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret-files: {{ include (print $.Template.BasePath "/secret-files.yaml") . | sha256sum }}
        checksum/secret-env: {{ include (print $.Template.BasePath "/secret-env.yaml") . | sha256sum }}
    spec:
      {{- if .Values.imagePullSecret.create }}
      imagePullSecrets:
        - name: {{ include "miloagent.fullname" . }}-ghcr-pull
      {{- end }}
      containers:
        - name: miloagent
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: web
              containerPort: {{ .Values.service.port }}
          envFrom:
            - secretRef:
                name: {{ include "miloagent.fullname" . }}-env
            {{- with .Values.existingSecrets.env }}
            - secretRef:
                name: {{ . }}
            {{- end }}
          {{- with .Values.probes.startup }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.probes.readiness }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.probes.liveness }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /app/data
              subPath: data
            - name: data
              mountPath: /app/projects
              subPath: projects
            - name: logs
              mountPath: /app/logs
            - name: config
              mountPath: /app/config/settings.yaml
              subPath: settings.yaml
              readOnly: true
            - name: config
              mountPath: /app/config/expert_personas.yaml
              subPath: expert_personas.yaml
              readOnly: true
            {{- $fileKeys := .Values.existingSecrets.fileKeys }}
            {{- range $k, $v := .Values.secrets }}
            {{- if and $v (not (has $k $fileKeys)) }}
            - name: secret-files
              mountPath: /app/config/{{ $k }}.yaml
              subPath: {{ $k }}.yaml
            {{- end }}
            {{- end }}
            {{- if .Values.existingSecrets.files }}
            {{- range $fileKeys }}
            - name: existing-secret-files
              mountPath: /app/config/{{ . }}.yaml
              subPath: {{ . }}.yaml
              readOnly: true
            {{- end }}
            {{- end }}
        {{- $exporter := .Values.bridge.exporter }}
        {{- if and .Values.bridge.enabled $exporter.enabled .Values.monitoring.enabled }}
        {{- range .Values.extraContainers }}
        {{- if eq .name "exporter" }}
        {{- fail "extraContainers has a container named exporter: the chart adds it with bridge.exporter; remove it from extraContainers or set bridge.exporter.enabled=false" }}
        {{- end }}
        {{- end }}
        # Prometheus exporter of the bridge image (docs/alerts.md): reads the log and the
        # database read-only, writes only its own probe file at the volume root
        - name: exporter
          image: {{ include "miloagent.bridge.image" . | quote }}
          imagePullPolicy: {{ .Values.bridge.image.pullPolicy }}
          command: [python3, -m, miloagent_bridge.exporter]
          env:
            - name: EXPORTER_PORT
              value: {{ .Values.monitoring.port | quote }}
            - name: EXPORTER_HEALTH_URL
              value: {{ printf "http://127.0.0.1:%v/health" .Values.service.port | quote }}
            {{- range $k, $v := $exporter.env }}
            - name: {{ $k }}
              value: {{ $v | toString | quote }}
            {{- end }}
          ports:
            - name: metrics
              containerPort: {{ .Values.monitoring.port }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 30
          resources:
            {{- toYaml $exporter.resources | nindent 12 }}
          securityContext:
            {{- toYaml $exporter.securityContext | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /volume
            - name: logs
              mountPath: /app/logs
              readOnly: true
        {{- end }}
        {{- with .Values.extraContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "miloagent.fullname" . }}-data
        - name: logs
          emptyDir: {}
        - name: config
          configMap:
            name: {{ include "miloagent.fullname" . }}-config
        - name: secret-files
          secret:
            secretName: {{ include "miloagent.fullname" . }}-files
        {{- with .Values.existingSecrets.files }}
        - name: existing-secret-files
          secret:
            secretName: {{ . }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
