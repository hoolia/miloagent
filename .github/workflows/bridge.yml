name: bridge

# Tests the bridge (bridge/) and builds its image ghcr.io/<owner>/miloagent-bridge next to
# the MiloAgent image of build-image.yml, with the same tags: sha-<commit>, latest on main
# and the git tag on v* tags. A pull request from a branch of this repository pushes
# sha-<head commit> for testing; one from a fork builds without pushing.
on:
  pull_request:
    paths: ["bridge/**", ".github/workflows/bridge.yml"]
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the locked dependencies and the test tools
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock
          python -m pip install --disable-pip-version-check --no-deps -e .
          python -m pip install --disable-pip-version-check pytest==9.2.0 pytest-asyncio==1.5.0 respx==0.23.1

      - name: Run the tests
        run: python -m pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PUSH: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      # sha tag of a pull request: its head commit, not the merge commit
      DOCKER_METADATA_PR_HEAD_SHA: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/miloagent-bridge
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=ref,event=tag

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: bridge
          file: bridge/Dockerfile
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=bridge
          cache-to: type=gha,mode=max,scope=bridge
