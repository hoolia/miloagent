name: bridge-test

on:
  pull_request:
    paths: ["bridge/**", ".github/workflows/bridge-test.yml"]
  push:
    branches: [main]
    paths: ["bridge/**", ".github/workflows/bridge-test.yml"]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install from the lock file
        run: |
          python -m venv .venv
          .venv/bin/pip install --quiet --require-hashes -r requirements.lock
          .venv/bin/pip install --quiet --no-deps -e .
          .venv/bin/pip install --quiet pytest==9.2.0 pytest-asyncio==1.5.0 respx==0.23.1

      - name: Tests
        run: .venv/bin/python -m pytest -q
